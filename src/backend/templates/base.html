<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espectrograma</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f4f3ef;
    --bg-tertiary: #eceae4;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-tertiary: #8a8880;
    --border-tertiary: rgba(0,0,0,0.12);
    --border-secondary: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --purple: #534AB7;
    --purple-dark: #3C3489;
    --purple-light: #EEEDFE;
    --teal-light: #E1F5EE;
    --teal-dark: #085041;
    --teal-mid: #1D9E75;
    --blue-light: #E6F1FB;
    --blue-dark: #0C447C;
    --blue-mid: #378ADD;
    --red-light: #FCEBEB;
    --red-dark: #791F1F;
    --red-mid: #E24B4A;
    --amber-light: #FAEEDA;
    --amber-dark: #633806;
    --amber-mid: #EF9F27;
    --gray-mid: #888780;
    --ui-scale: 1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #2a2a27;
      --bg-tertiary: #242422;
      --text-primary: #e8e6df;
      --text-secondary: #a8a69e;
      --text-tertiary: #6e6c66;
      --border-tertiary: rgba(255,255,255,0.10);
      --border-secondary: rgba(255,255,255,0.20);
      --purple-light: #26215C;
      --teal-light: #04342C;
      --blue-light: #042C53;
      --red-light: #501313;
      --amber-light: #412402;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-tertiary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 24px;
  }

  .device {
    width: 600px;
    background: var(--bg-primary);
    border-radius: 24px;
    border: 0.5px solid var(--border-secondary);
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    transform: scale(var(--ui-scale));
    transform-origin: top center;
    margin-bottom: calc(((600px * (var(--ui-scale) - 1)) / 2));
    position: relative;
    z-index: 1;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--border-tertiary);
    background: var(--bg-primary);
  }
  .nav-logo { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .nav-steps { display: flex; gap: 4px; align-items: center; }
  .step {
    font-size: 10px; padding: 2px 8px;
    border-radius: 99px; border: 0.5px solid var(--border-tertiary);
    color: var(--text-tertiary); background: var(--bg-primary);
  }
  .step.active { background: var(--purple-light); border-color: #AFA9EC; color: var(--purple-dark); }
  .step.done   { background: var(--teal-light);   border-color: #5DCAA5; color: var(--teal-dark); }
  .step-sep { font-size: 10px; color: var(--text-tertiary); }

  .content { padding: 20px 16px; }
  .screen-title { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .screen-sub   { font-size: 12px; color: var(--text-tertiary); margin-bottom: 20px; }
  .section-label {
    font-size: 10px; font-weight: 500; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px;
  }

  .btn-primary {
    width: 100%; margin-top: 16px; padding: 10px;
    border-radius: var(--radius-md); border: none;
    background: var(--purple); color: #fff;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: var(--purple-dark); }
  .btn-primary:disabled {
    background: var(--bg-secondary); color: var(--text-tertiary);
    border: 0.5px solid var(--border-tertiary); cursor: not-allowed;
  }
  .btn-secondary {
    padding: 8px 14px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-secondary);
    background: var(--bg-primary);
    font-size: 12px; color: var(--text-primary); cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn-secondary:hover { background: var(--bg-secondary); }
  .btn-accent {
    padding: 8px 14px; border-radius: var(--radius-md);
    border: none; background: var(--purple); color: #fff;
    font-size: 12px; font-weight: 500; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn-accent:hover { background: var(--purple-dark); }
  .row-btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  /* Spectrogram */
  .spectrogram-box {
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md);
    overflow: hidden; margin-bottom: 14px; position: relative;
    background: var(--bg-secondary);
    contain: layout style paint;
  }
  .spec-canvas-container {
    position: relative; width: 100%; height: 360px;
  }
  canvas.spec {
    display: block; width: 100%; height: 220px;
    position: absolute; top: 0; left: 0;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  canvas.spec-base {
    z-index: 1;
  }
  canvas.spec-overlay {
    z-index: 2;
  }
  .spectrogram-box.is-filtering .annotation {
    opacity: 0;
    border-left: 2px solid transparent;
    border-right: 2px solid transparent;
  }
  .spectrogram-box.is-filtering .annotation.is-visible {
    opacity: 1;
    border-left-color: rgba(255, 255, 255, 0.9);
    border-right-color: rgba(255, 255, 255, 0.9);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
  }
  .spec-axis-y {
    position: absolute; left: 0; top: 0; bottom: 20px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 8px 6px; font-size: 10px; color: #000000;
    font-weight: 500;
    pointer-events: none;
    z-index: 10;
  }
  .spec-axis-x {
    display: flex; justify-content: space-between;
    padding: 3px 6px; font-size: 9px; color: #000000;
    font-weight: 500;
    border-top: 0.5px solid var(--border-tertiary);
    z-index: 10;
  }
  .annotation {
    position: absolute; top: 0; bottom: 20px;
    opacity: 0.35; pointer-events: none;
    transition: opacity 0.25s ease;
    will-change: opacity;
  }

  .filter-hint {
    font-size: 11px; color: var(--text-tertiary); line-height: 1.45;
    margin: -4px 0 10px;
  }

  /* Event Filters */
  .event-filters {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .filter-btn {
    padding: 6px 12px; border-radius: 16px; border: 0.5px solid var(--border-secondary);
    background: var(--bg-secondary); color: var(--text-secondary);
    font-size: 11px; font-weight: 500; cursor: pointer;
    transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px;
  }
  .filter-btn:hover {
    background: var(--bg-tertiary); border-color: var(--border-tertiary);
  }
  .filter-btn.active {
    border-color: currentColor; font-weight: 600;
  }
  .filter-btn.active.filter-silence {
    background: rgba(0, 100, 200, 0.15); color: var(--blue-dark); border-color: rgba(0, 100, 200, 0.5);
  }
  .filter-btn.active.filter-clip {
    background: rgba(255, 0, 0, 0.15); color: var(--red-dark); border-color: rgba(255, 0, 0, 0.5);
  }
  .filter-btn.active.filter-energy {
    background: rgba(255, 100, 0, 0.15); color: var(--amber-dark); border-color: rgba(255, 100, 0, 0.5);
  }
  .filter-btn.active.filter-spectral {
    background: rgba(0, 200, 0, 0.15); color: var(--teal-dark); border-color: rgba(0, 200, 0, 0.5);
  }
  .filter-btn.active.filter-transient {
    background: rgba(255, 200, 0, 0.15); color: #8B7500; border-color: rgba(255, 200, 0, 0.5);
  }
  .filter-btn-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  /* Legend */
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Events */
  .events-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .event-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md); background: var(--bg-primary);
    transition: opacity 0.2s ease, background-color 0.2s ease;
  }
  .event-row.dim {
    opacity: 0.4;
    background: var(--bg-secondary);
  }
  .event-row-silence { border-color: rgba(0, 100, 200, 0.25); }
  .event-row-clip { border-color: rgba(255, 0, 0, 0.25); }
  .event-row-no-clip { border-style: dashed; background: var(--bg-secondary); }
  .events-collapsed { display: none; }
  .events-toggle-btn {
    width: 100%; margin-top: 5px; padding: 6px 10px;
    background: none; border: 0.5px dashed var(--border-secondary);
    border-radius: var(--radius-md); color: var(--text-tertiary);
    font-size: 11px; cursor: pointer; text-align: center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .events-toggle-btn:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border-secondary); }
  .event-group { margin-bottom: 12px; }
  .event-group.dim { opacity: 0.35; transition: opacity 0.2s ease; }
  .event-group-label {
    margin-bottom: 6px; font-size: 11px; font-weight: 600;
    color: var(--text-primary);
  }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
  .badge-silence { background: var(--blue-light);  color: var(--blue-dark); }
  .badge-clip    { background: var(--red-light);   color: var(--red-dark); }
  .badge-event   { background: var(--amber-light); color: var(--amber-dark); }
  .badge-energy { background: rgba(255, 100, 0, 0.15); color: var(--amber-dark); }
  .badge-spectral { background: rgba(0, 200, 0, 0.15); color: var(--teal-dark); }
  .badge-transient { background: rgba(255, 200, 0, 0.15); color: #8B7500; }
  .event-desc { font-size: 11px; color: var(--text-secondary); flex: 1; }
  .event-time { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }

  /* Feedback */
  .verdict {
    padding: 12px 14px; border-radius: var(--radius-md);
    margin-bottom: 16px; border: 0.5px solid var(--border-tertiary);
  }
  .verdict--good { background: var(--teal-light); border-color: #5DCAA5; }
  .verdict--good .verdict-label { color: var(--teal-dark); }
  .verdict--caution { background: var(--amber-light); border-color: var(--amber-mid); }
  .verdict--caution .verdict-label { color: var(--amber-dark); }
  .verdict--warn { background: var(--red-light); border-color: var(--red-mid); }
  .verdict--warn .verdict-label { color: var(--red-dark); }
  .verdict-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .verdict-detail { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    padding: 10px 8px; border-radius: var(--radius-md);
    background: var(--bg-secondary); border: 0.5px solid var(--border-tertiary);
    text-align: center;
  }
  .stat-card--warn { background: var(--red-light); border-color: var(--red-mid); }
  .stat-card--warn .stat-value { color: var(--red-dark); }
  .stat-value { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }

  .noise-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    font-size: 12px; font-weight: 500; margin-bottom: 14px;
    border: 0.5px solid var(--border-tertiary);
  }
  .noise-pill--low { background: var(--teal-light); color: var(--teal-dark); border-color: #5DCAA5; }
  .noise-pill--mid { background: var(--amber-light); color: var(--amber-dark); border-color: var(--amber-mid); }
  .noise-pill--high { background: var(--red-light); color: var(--red-dark); border-color: var(--red-mid); }
  .noise-pill--unknown { background: var(--bg-secondary); color: var(--text-secondary); }

  .feedback-card {
    padding: 4px 14px 12px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-tertiary);
    background: var(--bg-secondary); margin-bottom: 14px;
  }
  .feedback-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 0; border-bottom: 0.5px solid var(--border-tertiary);
  }
  .feedback-item:last-child { border-bottom: none; padding-bottom: 4px; }
  .feedback-icon {
    width: 28px; height: 28px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    background: var(--bg-primary); border: 0.5px solid var(--border-tertiary);
    color: var(--text-secondary);
  }
  .feedback-icon--ruido { color: var(--teal-dark); background: var(--teal-light); }
  .feedback-icon--silencio { color: var(--blue-dark); background: var(--blue-light); }
  .feedback-icon--distorcao { color: var(--red-dark); background: var(--red-light); }
  .feedback-icon--actividade { color: var(--amber-dark); background: var(--amber-light); }
  .feedback-body { flex: 1; min-width: 0; }
  .feedback-title { font-size: 11px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .feedback-text { font-size: 12px; color: var(--text-secondary); line-height: 1.55; }
  .feedback-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 8px; flex-shrink: 0; }

  .feedback-tip {
    padding: 10px 12px; border-radius: var(--radius-md);
    background: var(--purple-light); border: 0.5px solid #AFA9EC;
    margin-bottom: 14px; font-size: 11px; color: var(--purple-dark); line-height: 1.55;
  }
  .feedback-tip strong { font-weight: 600; }

  /* Analysis loading overlay */
  .analysis-loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    min-height: 280px;
    background: var(--bg-primary);
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .device.is-loading .analysis-content {
    max-height: 0;
    overflow: hidden;
    padding: 0;
    margin: 0;
  }
  .analysis-loading-spinner {
    width: 26px; height: 26px;
    border: 2px solid var(--border-tertiary);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: analysis-spin 0.65s linear infinite;
  }
  @keyframes analysis-spin { to { transform: rotate(360deg); } }
  .analysis-loading-label {
    font-size: 12px; color: var(--text-tertiary);
  }

  /* WIP block */
  .wip-block {
    border: 1.5px dashed var(--border-secondary);
    border-radius: var(--radius-lg);
    padding: 36px 20px;
    text-align: center;
    background: var(--bg-secondary);
    margin-bottom: 16px;
  }
  .wip-icon {
    width: 44px; height: 44px; margin: 0 auto 14px;
    border: 1.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-primary);
  }
  .wip-icon svg { width: 22px; height: 22px; stroke: var(--text-tertiary); }
  .wip-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }
  .wip-sub   { font-size: 11px; color: var(--text-tertiary); line-height: 1.6; margin-bottom: 14px; }
  .wip-badge {
    display: inline-block;
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    padding: 3px 10px; border-radius: 99px;
    background: var(--amber-light); color: var(--amber-dark);
    border: 0.5px solid var(--amber-mid);
  }

  /* Error */
  .error-box {
    margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-md);
    background: var(--red-light); border: 0.5px solid #F09595;
    font-size: 12px; color: var(--red-dark);
  }

  /* Upload zone */
  .upload-zone {
    display: block;
    position: relative;
    border: 1.5px dashed var(--border-secondary);
    border-radius: var(--radius-lg);
    padding: 40px 16px; text-align: center;
    background: var(--bg-primary); cursor: pointer;
    transition: background 0.15s;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover { background: var(--bg-secondary); }
  .upload-icon {
    width: 40px; height: 40px; margin: 0 auto 12px;
    border: 1.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
  }
  .upload-icon svg { width: 20px; height: 20px; stroke: var(--text-secondary); fill: none; stroke-width: 1.5; }
  .upload-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .upload-sub   { font-size: 11px; color: var(--text-tertiary); }

  /* Progress */
  .progress-wrap { margin-top: 16px; display: none; }
  .progress-bg { height: 3px; background: var(--bg-secondary); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 3px; background: var(--purple); border-radius: 99px; width: 0%; transition: width 0.2s linear; }
  .progress-label { font-size: 11px; color: var(--text-tertiary); }


</style>
</head>
<body>
{% block body %}{% endblock %}


<!-- ==================== NOTAS MUSICAIS ==================== -->
<canvas id="notes-canvas" style="
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  pointer-events:none;z-index:0;
"></canvas>

<script>
/* ===== NOTAS FLUTUANTES ===== */
!function(){
  var C = document.getElementById('notes-canvas');
  var X = C.getContext('2d');
  var SYMS = ['♩','♪','♫','♬','♩','♪','♫','𝄞','𝄢','♭','♮','♯','♥','♥'];
  var SIZES = [13,15,18,22,26,30];
  var N = 55;
  var notes = [];
  var RAF;
  var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){ isDark = e.matches; });

  function mkNote(initial) {
    return {
      x:    Math.random() * window.innerWidth,
      y:    initial ? Math.random() * window.innerHeight : window.innerHeight + 50,
      vx:   (Math.random() - 0.5) * 0.35,
      vy:   -(0.28 + Math.random() * 0.45),
      rot:  Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.008,
      size: SIZES[Math.floor(Math.random() * SIZES.length)],
      sym:  SYMS[Math.floor(Math.random() * SYMS.length)],
      ph:   Math.random() * Math.PI * 2
    };
  }

  function resize() {
    C.width  = window.innerWidth;
    C.height = window.innerHeight;
  }

  function frame() {
    X.clearRect(0, 0, C.width, C.height);
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      n.ph += 0.007;
      n.x  += n.vx + Math.sin(n.ph) * 0.28;
      n.y  += n.vy;
      n.rot += n.rotV;

      if (n.y < -60) { notes[i] = mkNote(false); continue; }

      var prog = 1 - n.y / C.height;
      var a = prog < 0.08 ? prog / 0.08
            : prog > 0.88 ? (1 - prog) / 0.12
            : 1;
      a *= (n.sym === '♥' ? 0.28 : 0.22);

      X.save();
      X.translate(n.x, n.y);
      X.rotate(n.rot);
      X.globalAlpha = a;
      X.fillStyle = n.sym === '♥'
        ? (isDark ? '#ff8888' : '#cc3333')
        : (isDark ? '#e8e6df' : '#1a1a18');
      X.font = n.size + 'px serif';
      X.textAlign = 'center';
      X.textBaseline = 'middle';
      X.fillText(n.sym, 0, 0);
      X.restore();
    }
    X.globalAlpha = 1;
    RAF = requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  for (var i = 0; i < N; i++) notes.push(mkNote(true));
  frame();
}();

</script>
<!-- ==================== FIM NOTAS ==================== -->

</body>
</html>
